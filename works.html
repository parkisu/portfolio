<script src="js/main.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

  const filters = document.querySelectorAll('.works-filter');
  const items = document.querySelectorAll('.work-item');

  const modal = document.getElementById('work-modal');
  const modalContent = modal.querySelector('.work-modal-content');
  const modalClose = modal.querySelector('.work-modal-close');


  /* ========================================
     WORK SERIES
  ======================================== */

  const workSeries = {

    kakao01: [
      'images02/kakao/01/1.png',
      'images02/kakao/01/2.png',
      'images02/kakao/01/3.png',
      'images02/kakao/01/4.png',
      'images02/kakao/01/5.png',
      'images02/kakao/01/6.png'
    ],

    kakao02: [
      'images02/kakao/02/01.png',
      'images02/kakao/02/02.png',
      'images02/kakao/02/03.png',
      'images02/kakao/02/04.png',
      'images02/kakao/02/05.png'
    ],

    kakao03: [
      'images02/kakao/03/1.png',
      'images02/kakao/03/2.png',
      'images02/kakao/03/3.png',
      'images02/kakao/03/4.png',
      'images02/kakao/03/5.png',
      'images02/kakao/03/6.png'
    ],

    kakao04: [
      'images02/kakao/04/1.png',
      'images02/kakao/04/2.png',
      'images02/kakao/04/3.png',
      'images02/kakao/04/4.png',
      'images02/kakao/04/5.png',
      'images02/kakao/04/6.png'
    ],

    kakao05: [
      'images02/kakao/05/1.png',
      'images02/kakao/05/2.png',
      'images02/kakao/05/3.png',
      'images02/kakao/05/4.png',
      'images02/kakao/05/5.png',
      'images02/kakao/05/6.png'
    ],

    kakao06: [
      'images02/kakao/06/01.png',
      'images02/kakao/06/02.png',
      'images02/kakao/06/03.png',
      'images02/kakao/06/04.png',
      'images02/kakao/06/05.png',
      'images02/kakao/06/06.png'
    ],

    kakao07: [
      'images02/kakao/07/1.png',
      'images02/kakao/07/2.png',
      'images02/kakao/07/3.png',
      'images02/kakao/07/4.png',
      'images02/kakao/07/5.png',
      'images02/kakao/07/6.png'
    ],

    leaflet: [
      'images02/offline/re_01.png',
      'images02/offline/re_02.png',
      'images02/offline/re_03.png',
      'images02/offline/re_04.png',
      'images02/offline/re_05.png',
      'images02/offline/re_06.png'
    ]

  };


  /* ========================================
     FILTER
  ======================================== */

  filters.forEach(function (button) {

    button.addEventListener('click', function () {

      const filter = button.dataset.filter;

      filters.forEach(function (btn) {
        btn.classList.remove('is-active');
      });

      button.classList.add('is-active');

      items.forEach(function (item) {
        const show = filter === 'all' || item.dataset.category === filter;
        item.classList.toggle('is-hidden', !show);
      });

    });

  });


  /* ========================================
     OPEN MODAL
  ======================================== */

  function openModal(item) {

    const series = item.dataset.series;
    const category = item.dataset.category;
    const thumbnail = item.querySelector('.work-image');

    modalContent.innerHTML = '';

    /* OFFLINE은 CSS에서 별도로 width 조절 */
    modalContent.classList.toggle('is-offline', category === 'offline');


    /* SERIES */
    if (series && workSeries[series]) {

      workSeries[series].forEach(function (src) {

        const img = document.createElement('img');

        img.src = src;
        img.alt = '';
        img.className = 'work-modal-image';

        modalContent.appendChild(img);

      });

    }

    /* SINGLE IMAGE */
    else {

      const img = document.createElement('img');

      img.src = thumbnail.getAttribute('src');
      img.alt = thumbnail.alt || '';
      img.className = 'work-modal-image';

      modalContent.appendChild(img);

    }


    modal.hidden = false;
    modal.setAttribute('aria-hidden', 'false');

    document.body.classList.add('work-modal-open');

    modal.scrollTop = 0;
    modal.scrollLeft = 0;

  }


  /* ========================================
     CLOSE MODAL
  ======================================== */

  function closeModal() {

    modal.hidden = true;
    modal.setAttribute('aria-hidden', 'true');

    modalContent.innerHTML = '';
    modalContent.classList.remove('is-offline');

    document.body.classList.remove('work-modal-open');

  }


  /* ========================================
     ITEM CLICK
  ======================================== */

  items.forEach(function (item) {

    item.addEventListener('click', function () {
      openModal(item);
    });

  });


  /* ========================================
     MODAL SCROLL
  ======================================== */

  modal.addEventListener('wheel', function (event) {

    if (modal.hidden) return;

    event.preventDefault();
    event.stopPropagation();

    modal.scrollTop += event.deltaY;

  }, { passive: false });


  /* ========================================
     CLOSE EVENTS
  ======================================== */

  modalClose.addEventListener('click', function (event) {
    event.stopPropagation();
    closeModal();
  });


  modal.addEventListener('click', function (event) {

    if (event.target === modal) {
      closeModal();
    }

  });


  document.addEventListener('keydown', function (event) {

    if (event.key === 'Escape' && !modal.hidden) {
      closeModal();
    }

  });

});
</script>
